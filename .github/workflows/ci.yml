name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the code; it never pushes, comments or deploys.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Lint the API (ESLint, typescript-eslint) and the web app (angular-eslint)
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    name: Formatting
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Check formatting (Prettier)
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Test the rule, the API and the web app (Vitest)
        run: npm test

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Build the Angular app, the NestJS API and the images (as Vercel does)
        run: npm run build
