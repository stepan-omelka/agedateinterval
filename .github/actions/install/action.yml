name: Install

description: Set up Node.js and install the dependencies of the root, api/ and web/

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: |
          package-lock.json
          api/package-lock.json
          web/package-lock.json
    # --ignore-scripts skips Husky and the root postinstall, whose `npm install` may
    # rewrite a lockfile; `npm ci` in each project installs exactly what is locked.
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts
        npm ci --prefix api
        npm ci --prefix web
      shell: bash
