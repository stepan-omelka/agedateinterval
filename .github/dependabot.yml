version: 2
updates:
  # npm dependencies — security updates only.
  # open-pull-requests-limit: 0 disables version-update PRs; security PRs are
  # exempt from the limit and still inherit the commit-message config below.
  # Each project has its own lockfile, so each needs its own entry.
  - package-ecosystem: npm
    directories: ['/', '/api', '/web']
    schedule:
      interval: weekly # required, but no version PRs open due to limit 0
    open-pull-requests-limit: 0
    commit-message:
      prefix: build # production dependencies
      prefix-development: chore # devDependencies

  # GitHub Actions — security updates only (see notes above).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
