@if (image.error()) {
  <button type="button" class="share" (click)="image.reload()">
    Couldn't paint the image. Try again
  </button>
} @else {
  <button type="button" class="share" [disabled]="!image.hasValue()" (click)="share()">
    @if (image.hasValue()) {
      <svg class="icon" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M4 3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"
        />
      </svg>
      Share on your story
    } @else {
      Painting pixels…
    }
  </button>
}
<p class="status" role="status">{{ status() }}</p>
